<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLearn — Bốn thành phần của một prompt hiệu quả</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<script src="fixture.js"></script>
<script src="shared.js"></script>
<script>
/* ===========================================================
   MÀN 1 — COMMON CONTEXT. Giống hệt nhau cho cả B và C.

   Learner TỰ đánh dấu trong lúc đọc: bôi đen một đoạn rồi chọn
   Highlight / Chưa hiểu / Câu hỏi / Ghi chú.

   Bộ dấu vết tạo ra được lưu vào sessionStorage và dùng chung
   cho CẢ HAI option — learner chỉ đánh dấu một lần, nên B và C
   vẫn ăn đúng một input (Comparison Contract).

   Facilitator điều khiển hoàn toàn bằng tham số URL — không có
   nút chọn option nào hiện trên màn hình:

     index.html?opt=b      → đi tới "Cùng tổ chức"
     index.html?opt=c      → đi tới "Nháp sẵn"      (mặc định: b)
     &fresh=1              → xoá hết dấu vết, dùng khi đổi tester
     &demo=1               → nạp sẵn bộ dấu vết mẫu để nhóm diễn tập
   =========================================================== */

const params = new URLSearchParams(location.search);
const OPT = params.get('opt') === 'c' ? 'c' : 'b';

/* Dấu vết được GIỮ LẠI khi quay về Màn 1.
   Lý do: tester chạy option thứ hai phải dùng ĐÚNG bộ dấu vết đã tạo ở lượt đầu,
   nếu không thì B và C ăn input khác nhau và không còn so sánh được. */
if (params.get('fresh') === '1') setTraces([]);
if (params.get('demo') === '1' && !getTraces().length) DEMO_TRACES.forEach(t => addTrace({ ...t }));
const restored = getTraces().length > 0;

const main = chrome({
  progress: '3/14 hoạt động', pct: 21,
  notebook: { href: `option-${OPT}.html` }   // vào Sổ ghi chú bất cứ lúc nào
});

main.innerHTML = `
<div class="vl-card">
  <button class="vl-ai-fab" title="Trợ lý AI">✦</button>

  <div class="lesson-meta"><span>${COURSE.name}</span><span>·</span><span>${COURSE.lessonNo}</span><span>·</span><span>${COURSE.date}</span></div>
  <h1 class="lesson-h1">${COURSE.title}</h1>
  <p class="lesson-sub">${COURSE.subtitle}</p>

  <div class="mark-hint">${restored
    ? 'Bài bạn vừa học, cùng những chỗ bạn đã đánh dấu. Bôi đen để đánh dấu thêm.'
    : 'Bôi đen một đoạn bất kỳ để đánh dấu.'}</div>

  <div id="lesson">
    ${SECTIONS.map(s => `
      <div class="sec${s.hard ? ' hard' : ''}" id="${s.id}" data-sec="${s.id}">
        <h2>${s.no}. ${s.title}</h2>
        ${s.html}
      </div>`).join('')}
  </div>

  <hr style="border:0;border-top:1px solid var(--border);margin:30px 0 24px;max-width:760px">

  <div class="step-head">
    <div class="step-kicker">HẾT BÀI</div>
    <h1>Bạn đã đọc xong bài này</h1>
    <p>Những chỗ bạn đã đánh dấu trong lúc học:</p>
  </div>

  <div id="traceList"></div>

  <div class="actions" id="noteCta"></div>

  <div class="actions" id="go"></div>
</div>

<div class="mark-bar" id="markBar">
  <button data-k="hl"><i class="sw hl"></i>Highlight</button>
  <button data-k="un"><i class="sw un"></i>Chưa hiểu</button>
  <button data-k="qs"><i class="sw qs"></i>Câu hỏi</button>
  <button data-k="nt"><i class="sw nt"></i>Ghi chú</button>
</div>`;

/* ===========================================================
   Chọn văn bản → thanh công cụ đánh dấu
   =========================================================== */

const bar = document.getElementById('markBar');
const lesson = document.getElementById('lesson');
let pending = null;   // { range, secId, text }

function hideBar() { bar.classList.remove('on'); pending = null; }

document.addEventListener('mouseup', e => {
  if (bar.contains(e.target)) return;
  const sel = window.getSelection();
  const text = sel && !sel.isCollapsed ? sel.toString().trim() : '';
  if (!text || text.length < 3) { hideBar(); return; }

  const range = sel.getRangeAt(0);
  const host = range.commonAncestorContainer.nodeType === 1
    ? range.commonAncestorContainer
    : range.commonAncestorContainer.parentElement;
  const sec = host && host.closest ? host.closest('[data-sec]') : null;
  if (!sec || !lesson.contains(sec)) { hideBar(); return; }

  pending = { range: range.cloneRange(), secId: sec.dataset.sec, text };

  const r = range.getBoundingClientRect();
  bar.classList.add('on');
  const bw = bar.offsetWidth || 340;
  bar.style.left = Math.max(12, Math.min(window.innerWidth - bw - 12, r.left + r.width / 2 - bw / 2)) + 'px';
  bar.style.top = (r.top + window.scrollY - bar.offsetHeight - 10) + 'px';
});

document.addEventListener('scroll', hideBar, true);

bar.querySelectorAll('button').forEach(b => b.onclick = () => {
  if (!pending) return;
  const kind = b.dataset.k;
  const { range, secId, text } = pending;

  if (kind === 'hl' || kind === 'un') {
    paint(range, kind, text, secId);
  } else {
    /* Câu hỏi / Ghi chú: đoạn bôi đen là chỗ neo, learner gõ nội dung */
    paint(range, kind, text, secId, true);
  }
  window.getSelection().removeAllRanges();
  hideBar();
});

/* Bọc đoạn đã chọn và ghi dấu vết */
function paint(range, kind, text, secId, askText) {
  let rec;
  if (askText) {
    openComposer(kind, secId, text, range);
    return;
  }
  rec = addTrace({ kind, secId, text });
  wrap(range, kind, rec.id);
  renderTraces();
}

function wrap(range, kind, id) {
  const span = document.createElement(kind === 'hl' ? 'mark' : 'span');
  span.className = kind === 'hl' ? 'hl' : (kind === 'un' ? 'unclear' : 'anchor');
  span.dataset.tid = id;
  try {
    span.appendChild(range.extractContents());
    range.insertNode(span);
    const tag = document.createElement('span');
    tag.className = 'trace-tag' + (kind === 'hl' ? ' h' : '');
    tag.textContent = id;
    span.after(tag);
    tag.dataset.tid = id;
  } catch (err) {
    /* Chọn vắt qua nhiều đoạn — vẫn ghi dấu vết, chỉ không tô được */
  }
}

function wipe() {
  getTraces().forEach(t => unwrap(t.id));
  setTraces([]);
}

function unwrap(id) {
  document.querySelectorAll(`[data-tid="${id}"]`).forEach(el => {
    if (el.classList.contains('trace-tag')) { el.remove(); return; }
    const p = el.parentNode;
    while (el.firstChild) p.insertBefore(el.firstChild, el);
    p.removeChild(el);
    p.normalize();
  });
}

/* ---------- Ô gõ câu hỏi / ghi chú ---------- */

function openComposer(kind, secId, anchorText, range) {
  const sec = secId ? document.getElementById(secId) : null;
  const box = document.createElement('div');
  box.className = 'composer';
  box.innerHTML = `
    <div class="cm-head">${kind === 'qs' ? 'Viết câu hỏi của bạn' : 'Viết ghi chú ngắn'}
      ${anchorText ? `<span class="muted small">· về “${esc(anchorText.slice(0, 60))}${anchorText.length > 60 ? '…' : ''}”</span>` : ''}</div>
    <textarea rows="2" placeholder="${kind === 'qs' ? 'Điều bạn còn thắc mắc…' : 'Điều bạn muốn nhớ…'}"></textarea>
    <div class="cm-row"><button class="btn sm primary" data-a="ok">Lưu</button>
      <button class="btn sm ghost" data-a="no">Huỷ</button></div>`;

  (sec || document.getElementById('traceList')).insertAdjacentElement(sec ? 'beforeend' : 'beforebegin', box);
  const ta = box.querySelector('textarea');
  ta.focus();

  box.querySelector('[data-a=no]').onclick = () => box.remove();
  box.querySelector('[data-a=ok]').onclick = () => {
    const v = ta.value.trim();
    if (!v) { ta.focus(); return; }
    const rec = addTrace({ kind, secId, text: v, anchor: anchorText || null });
    if (range && anchorText) { try { wrap(range, kind, rec.id); } catch (e) {} }
    box.remove();
    renderTraces();
  };
}

/* ---------- Danh sách dấu vết ---------- */

function renderTraces() {
  const list = getTraces();
  const el = document.getElementById('traceList');
  const head = `<div class="traces-head">
      <span>Dấu vết của bạn</span>
      <span class="th-right"><span class="muted">${list.length} mục</span>
        <button class="btn sm" id="addNote">+ Ghi chú chung</button></span>
    </div>`;
  el.innerHTML = `<div class="traces">${head}
    ${list.length
      ? list.map(t => traceRow(t, `<button class="btn sm ghost" data-del="${t.id}" title="Bỏ đánh dấu">×</button>`)).join('')
      : '<div class="trace-row"><span class="muted small">Chưa có. Bôi đen một đoạn trong bài để đánh dấu.</span></div>'}
  </div>`;

  el.querySelector('#addNote').onclick = () => openComposer('nt', null, null, null);
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    unwrap(b.dataset.del);
    removeTrace(b.dataset.del);
    renderTraces();
  });
  wireSources(el);
  renderNoteCta();
  renderGo();
  refreshNoteBadge();
}

/* ---------- Lối vào Sổ ghi chú, ngay dưới bảng dấu vết ----------
   Lối thứ hai bên cạnh nút trên nav. Learner nào bỏ qua thanh nav
   vẫn gặp nó đúng lúc vừa xem lại dấu vết của mình. */

function renderNoteCta() {
  const n = getTraces().length;
  document.getElementById('noteCta').innerHTML = `
    <a class="vl-note lg" href="option-${OPT}.html">
      ${ICON_NOTE}<span>Mở Sổ ghi chú</span>${n ? `<span class="cnt">${n}</span>` : ''}
    </a>
    <span class="small muted">Tạo ghi chú từ những chỗ bạn đã đánh dấu.</span>`;
}

/* ---------- Nút đi tiếp ---------- */

function renderGo() {
  const n = getTraces().length;
  const go = document.getElementById('go');
  go.innerHTML = `<button class="btn primary" id="next">Hoàn thành bài học →</button>
    ${n ? '' : '<span class="small muted">Bạn chưa đánh dấu gì — vẫn đi tiếp được.</span>'}`;
  document.getElementById('next').onclick = () => location.href = `option-${OPT}.html`;
}

/* ---------- Vẽ lại dấu vết đã có (lượt thứ hai) ----------

   Dấu vết lưu chuỗi do Selection.toString() trả về — chuỗi này đã
   GỘP khoảng trắng, nên một đoạn vắt qua chỗ xuống dòng trong source
   sẽ KHÔNG khớp với node.textContent (còn nguyên \n và thụt lề).
   Tìm theo bản gộp khoảng trắng rồi chiếu ngược về offset thật. */

function findAnchorRange(root, anchor) {
  const target = anchor.replace(/\s+/g, ' ').trim();
  if (!target) return null;
  const wk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = wk.nextNode())) {
    const raw = node.textContent;
    let flat = '';
    const map = [];                       // map[i trong flat] = offset thật trong raw
    for (let i = 0; i < raw.length; i++) {
      if (/\s/.test(raw[i])) {
        if (!flat || flat.endsWith(' ')) continue;
        flat += ' ';
      } else {
        flat += raw[i];
      }
      map.push(i);
    }
    const j = flat.indexOf(target);
    if (j < 0) continue;
    const r = document.createRange();
    r.setStart(node, map[j]);
    r.setEnd(node, map[j + target.length - 1] + 1);
    return r;
  }
  return null;
}

function repaintAll() {
  getTraces().forEach(t => {
    const anchor = t.anchor || (t.kind === 'hl' || t.kind === 'un' ? t.text : null);
    if (!t.secId || !anchor) return;
    const root = document.getElementById(t.secId);
    if (!root) return;
    const r = findAnchorRange(root, anchor);
    if (r) wrap(r, t.kind, t.id);
  });
}

if (restored) repaintAll();
renderTraces();
wireSources(main);
</script>
</body>
</html>
